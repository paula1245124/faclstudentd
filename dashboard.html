<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>لوحتي — منصة المواد الدراسية</title>
<style>
:root{--bg:#f6f8fa;--s:#fff;--b:#d0d7de;--t:#1f2328;--m:#59636e;--p:#2563eb;--w:#9a6700;--d:#cf222e;--ok:#1a7f37}
[data-theme=dark]{--bg:#0d1117;--s:#161b22;--b:#30363d;--t:#e6edf3;--m:#9198a1;--p:#58a6ff;--w:#d29922;--d:#f85149;--ok:#3fb950}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.7 Tahoma,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:920px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:22px 0 8px}
.sub{color:var(--m);font-size:14px}
a,button,select,summary{color:var(--p);font:inherit}
.btn{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:8px 14px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
select{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:8px;min-height:44px;color:var(--t)}
.card{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:12px 16px;margin-bottom:8px;border-inline-start:4px solid var(--b)}
.card.now{border-inline-start-color:var(--ok)}.card.next{border-inline-start-color:var(--p)}
.card.done{opacity:.55}.card.cancelled .nm{text-decoration:line-through}
.hero{border-inline-start:6px solid var(--p);padding:16px 18px}
.big{font-size:24px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.tm{font-variant-numeric:tabular-nums;font-weight:700;direction:ltr;unicode-bidi:isolate}
.meta{color:var(--m);font-size:14px}
.bd{display:inline-block;border:1px solid var(--b);border-radius:999px;padding:0 10px;font-size:13px;color:var(--m)}
.bd.cancelled,.bd.urgent{color:var(--d);border-color:var(--d)}
.bd.moved,.bd.online,.bd.makeup,.bd.soon{color:var(--w);border-color:var(--w)}
.alert{border-inline-start-color:var(--w);background:color-mix(in srgb,var(--w) 10%,var(--s))}
#banner{display:none;border:1px solid var(--w);color:var(--w);border-radius:10px;padding:8px 12px;margin-bottom:12px}
details{margin-bottom:6px}summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style>
</head>
<body>
<main>
<header>
  <div><h1>لوحتي</h1><div class="sub" id="today"></div></div>
  <div class="row">
    <select id="grp" aria-label="المجموعة"><option value="">كل المجموعات</option></select>
    <button class="btn" id="rf" type="button">تحديث</button>
    <a class="btn" href="index.html">المحاضرات والأسئلة</a>
  </div>
</header>
<div id="banner" role="status"></div>
<div id="alerts"></div>
<h2>المحاضرة الجاية</h2><div id="next"></div>
<h2>جدول النهاردة</h2><div id="day"></div>
<h2>المواعيد القادمة</h2><div id="dl"></div>
<h2>جدول الأسبوع</h2><div id="week"></div>
<p class="sub" id="stamp"></p>
</main>
<script>
(function(){
'use strict';
var DAYS=['Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday'],
AR={Saturday:'السبت',Sunday:'الأحد',Monday:'الاثنين',Tuesday:'الثلاثاء',Wednesday:'الأربعاء',Thursday:'الخميس',Friday:'الجمعة'},
TYPE={lecture:'محاضرة',section:'سكشن',lab:'معمل',exam:'امتحان',other:'أخرى',assignment:'تسليم',quiz:'كويز',midterm:'ميدتيرم',final:'فاينل',project:'مشروع'},
ST={cancelled:'ملغاة',moved:'متغيّرة',online:'أونلاين',makeup:'تعويضية'},
KEY='sd.cache.v1',GK='sd.group',D=null,last=0;
function $(i){return document.getElementById(i)}
function h(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function theme(){var m=null;try{m=localStorage.getItem('themeMode')}catch(e){}
 var d=m==='dark'||m==='night'||(m!=='light'&&m!=='noon'&&matchMedia('(prefers-color-scheme:dark)').matches);
 document.documentElement.dataset.theme=d?'dark':'light';
 document.querySelector('meta[name=theme-color]').content=d?'#161b22':'#ffffff'}
function cairo(){var p={};new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Cairo',weekday:'long',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});
 return{day:p.weekday,min:+p.hour*60+ +p.minute,date:p.year+'-'+p.month+'-'+p.day,at:new Date(+p.year,+p.month-1,+p.day,+p.hour,+p.minute)}}
function tm(s){var a=s.split(':');return+a[0]*60+ +a[1]}
function dur(min){if(min<60)return min+' دقيقة';if(min<1440)return Math.floor(min/60)+' ساعة'+(min%60?' و'+min%60+' دقيقة':'');return Math.floor(min/1440)+' يوم'}
function sess(day,n){var g=$('grp').value;
 return((D&&D.schedule)||[]).filter(function(s){return s.day===day&&(!s.effective_from||s.effective_from<=n.date)&&(!s.effective_to||s.effective_to>=n.date)&&(!g||!s.group||/^all$/i.test(s.group)||s.group===g)}).sort(function(a,b){return tm(a.start)-tm(b.start)})}
function card(s,state){var c=h('div','card '+(state||'')+' '+(s.status||'')),r=h('div','row');
 r.appendChild(h('span','tm',s.start+' – '+s.end));r.appendChild(h('strong','nm',s.course_name_ar));
 if(TYPE[s.type])r.appendChild(h('span','bd',TYPE[s.type]));
 if(ST[s.status])r.appendChild(h('span','bd '+s.status,ST[s.status]));
 if(state==='now')r.appendChild(h('span','bd','دلوقتي'));
 c.appendChild(r);
 var m=[s.instructor,s.location,s.group&&!/^all$/i.test(s.group)?'مجموعة '+s.group:'',s.notes].filter(Boolean).join(' • ');
 if(m)c.appendChild(h('div','meta',m));return c}
function empty(el,t){el.appendChild(h('p','meta',t))}
function draw(){
 var n=cairo();$('today').textContent=AR[n.day]+' — '+n.date;
 ['alerts','next','day','dl','week'].forEach(function(i){$(i).textContent=''});
 if(!D){empty($('next'),'مفيش بيانات لسه.');return}
 // تنبيهات مهمة
 (D.announcements||[]).filter(function(a){return a.priority==='important'&&(!a.publish_at||a.publish_at<=n.date)&&(!a.expires_at||a.expires_at>=n.date)}).forEach(function(a){
  var c=h('div','card alert');c.appendChild(h('strong',null,'مهم: '+a.title));if(a.body)c.appendChild(h('div','meta',a.body));
  if(a.link&&/^https:\/\//i.test(a.link)){var l=h('a',null,'فتح الرابط');l.href=a.link;l.target='_blank';l.rel='noopener noreferrer';c.appendChild(l)}
  $('alerts').appendChild(c)});
 // اليوم + الجاية
 var today=sess(n.day,n),nx=null,idx=DAYS.indexOf(n.day);
 today.forEach(function(s){var st=s.status==='cancelled'?'cancelled':tm(s.end)<=n.min?'done':tm(s.start)<=n.min?'now':'';
  if(!nx&&!st&&tm(s.start)>n.min)nx={s:s,i:0};$('day').appendChild(card(s,st))});
 if(!today.length)empty($('day'),'مفيش محاضرات النهاردة.');
 for(var i=1;i<8&&!nx;i++){var dn=DAYS[(idx+i)%7],q=sess(dn,n).filter(function(s){return s.status!=='cancelled'});if(q.length)nx={s:q[0],i:i,d:dn}}
 if(nx){var c=card(nx.s,'next');c.classList.add('hero');
  c.insertBefore(h('div','big',nx.i?'يوم '+AR[nx.d]:'بعد '+dur(tm(nx.s.start)-n.min)),c.firstChild);$('next').appendChild(c)}
 else empty($('next'),'مفيش محاضرات جاية في الجدول.');
 // المواعيد
 var dl=(D.deadlines||[]).map(function(d){var p=d.due_at.split(/[- :]/);d._t=new Date(+p[0],+p[1]-1,+p[2],+(p[3]||23),+(p[4]||59));return d})
  .filter(function(d){return d._t>=n.at}).sort(function(a,b){return a._t-b._t}).slice(0,5);
 dl.forEach(function(d){var m=Math.round((d._t-n.at)/60000),c=h('div','card'),r=h('div','row');
  r.appendChild(h('strong',null,d.title));if(TYPE[d.type])r.appendChild(h('span','bd',TYPE[d.type]));
  r.appendChild(h('span','bd '+(m<=1440?'urgent':m<=4320?'soon':''),'بعد '+dur(m)));c.appendChild(r);
  var mt=[d.course_code,d.due_at,d.location,d.notes].filter(Boolean).join(' • ');if(mt)c.appendChild(h('div','meta',mt));$('dl').appendChild(c)});
 if(!dl.length)empty($('dl'),'مفيش مواعيد قادمة.');
 // الأسبوع
 DAYS.forEach(function(dn){var q=sess(dn,n);if(!q.length&&dn==='Friday')return;
  var d=document.createElement('details');d.open=dn===n.day;var s=h('summary',null,AR[dn]+' ('+q.length+')');d.appendChild(s);
  q.forEach(function(x){d.appendChild(card(x,x.status==='cancelled'?'cancelled':''))});
  if(!q.length)d.appendChild(h('p','meta','مفيش محاضرات.'));$('week').appendChild(d)});
 $('stamp').textContent=last?'آخر تحديث: '+new Date(last).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):''}
function groups(){var sel=$('grp'),cur=ls(GK)||'',set={};
 ((D&&D.schedule)||[]).forEach(function(s){if(s.group&&!/^all$/i.test(s.group))set[s.group]=1});
 while(sel.options.length>1)sel.remove(1);
 Object.keys(set).sort().forEach(function(g){sel.appendChild(new Option('مجموعة '+g,g))});sel.value=set[cur]?cur:''}
function get(t){return fetch('/api/sheet?tab='+t,{headers:{Accept:'application/json'}}).then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.code);return j.items}).catch(function(e){return t==='schedule'?Promise.reject(e):null})}
function banner(t){var b=$('banner');b.textContent=t;b.style.display=t?'block':'none'}
function load(){$('rf').disabled=true;
 Promise.all(['schedule','announcements','deadlines'].map(get)).then(function(a){
  D={schedule:a[0],announcements:a[1]||(D&&D.announcements)||[],deadlines:a[2]||(D&&D.deadlines)||[]};
  last=Date.now();ls(KEY,{t:last,d:D});banner('');groups();draw()})
 .catch(function(){banner(D?'تعذّر التحديث — ده آخر جدول محفوظ'+(navigator.onLine?'':' (غير متصل)'):'تعذّر تحميل الجدول — تحقق من إعداد الشيت وروابط النشر.')})
 .then(function(){$('rf').disabled=false})}
theme();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',theme);
var c=ls(KEY);if(c&&c.d){D=c.d;last=c.t}
$('grp').addEventListener('change',function(){ls(GK,this.value);draw()});
$('rf').addEventListener('click',load);
document.addEventListener('visibilitychange',function(){if(!document.hidden){theme();draw();if(Date.now()-last>300000)load()}});
setInterval(function(){if(!document.hidden)draw()},60000);
setInterval(function(){if(!document.hidden)load()},600000);
groups();draw();load();
})();
</script>
</body>
</html>
